# 复制到服务器 /etc/nginx/sites-available/knowledge-service 后 ln -s 到 sites-enabled
# 注意：sites-enabled 内不要留 .bak 副本，否则会 duplicate default server

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/knowledge-service/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 浏览/搜索(/search)、注册登录(/users)、个人中心(/user_admin)、可视化(/api) 均需反代
    location ~ ^/(search|users|user_admin|api) {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

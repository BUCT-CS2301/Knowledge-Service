# 复制到服务器 /etc/nginx/sites-available/ 后按需改名，并 ln -s 到 sites-enabled
# 将 server_name 与 root 路径改成你的域名与 dist 实际目录

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/knowledge-service/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot 对外暴露的业务路径（与项目 Controller 前缀一致）
    location ~ ^/(search|users|user_admin|api)(/|$) {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
